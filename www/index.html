<!DOCTYPE>
<html>
<head> 
<title>MTG counter online</title>
<meta name="keywords" content="MTG, magiс the gathering, counter, online" />
<meta name="description" content="Simple and fast online MTG counter" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<meta name="theme-color" content="#000">
<meta charset=utf-8>
<meta http-equiv=X-UA-Compatible content="IE=edge">
<link rel="shortcut icon" href="favicon.png" type="image/png">


<link type="text/css" href="files/css/main.css" rel="stylesheet" />
<script src="files/js/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="files/js/main.js" type="text/javascript"></script>
<script src="files/js/fullscreen.js" type="text/javascript"></script>
</head> 
<body>
<div class="main_wrap">

    <div class="player og white">
        <div class="mana">
            <div data-color="green"></div>
            <div data-color="red"  ></div>
            <div data-color="black"></div>
            <div data-color="blue" ></div>
            <div data-color="white"></div>
        </div>
        <div class="m"></div>
        <div class="p"></div>
        <div class="delta noselect"></div>
        <div class="cnt noselect">
            20
        </div>
        <div class="poison-toggle noselect">☠</div>
        <div class="poison noselect">
            <div class="pm">−</div>
            <div class="pcnt">0</div>
            <div class="pp">+</div>
        </div>
        <div class="dice_shadow">
            <div class="dice static"></div>
        </div>
    </div>

    <div class="settings">
        <div class="settings-left">
            <div class="icon dice"></div>
            <div class="icon life20">20</div>
            <div class="icon life40">40</div>
        </div>
        <div class="icon cog"></div>
        <div class="settings-right">
            <div class="icon two_player"></div>
            <div class="icon three_player"></div>
            <div class="icon four_player"></div>
        </div>
    </div>

    <div class="fullscreen noselect">fullscreen</div>
</div>

</body>
</html>
